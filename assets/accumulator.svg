<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Accumulator · keep a running total</title><desc id="desc">Sum 4, 9, 2 by updating one total box: 0 to 4 to 13 to 15.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#387ba2"/></marker></defs><rect width="960" height="620" rx="18" fill="#ffffff"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="29" fill="#18334b" text-anchor="start">Accumulator · keep a running total</text><text x="36" y="83" font-family="Arial, sans-serif" font-size="19" fill="#18334b" text-anchor="start">One box remembers the sum of everything visited so far.</text><text x="55" y="135" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">INPUT</text><rect x="155" y="103" width="68" height="52" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="189" y="138.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">4</text><rect x="243" y="103" width="68" height="52" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="277" y="138.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">9</text><rect x="331" y="103" width="68" height="52" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="365" y="138.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">2</text><text x="55" y="213" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">START</text><rect x="155" y="180" width="120" height="62" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="215" y="220.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">0</text><text x="305" y="218" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">Nothing visited yet → total starts at 0.</text><text x="55" y="299" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 1</text><rect x="155" y="265" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="215" y="304.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">0</text><text x="305" y="303" font-family="Arial, sans-serif" font-size="30" fill="#18334b" text-anchor="start">+</text><rect x="350" y="265" width="70" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="385" y="304.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">4</text><path d="M445 295 L525 295" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="265" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="610" y="304.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">4</text><text x="700" y="301" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">total = 0 + 4</text><text x="55" y="393" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 2</text><rect x="155" y="359" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="215" y="398.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">4</text><text x="305" y="397" font-family="Arial, sans-serif" font-size="30" fill="#18334b" text-anchor="start">+</text><rect x="350" y="359" width="70" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="385" y="398.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">9</text><path d="M445 389 L525 389" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="359" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="610" y="398.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">13</text><text x="700" y="395" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">total = 4 + 9</text><text x="55" y="487" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 3</text><rect x="155" y="453" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="215" y="492.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">13</text><text x="305" y="491" font-family="Arial, sans-serif" font-size="30" fill="#18334b" text-anchor="start">+</text><rect x="350" y="453" width="70" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="385" y="492.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">2</text><path d="M445 483 L525 483" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="453" width="120" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="610" y="492.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">15</text><text x="700" y="489" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">total = 13 + 2</text><text x="155" y="580" font-family="Arial, sans-serif" font-size="22" fill="#18334b" text-anchor="start">COUNT instead? Add 1 each time: 0 → 1 → 2 → 3.</text></svg>