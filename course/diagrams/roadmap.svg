37" class="text-bold" style="text-anchor:middle;font-size:18px">2.9 Search and combine</text></g><g class="cGFydDIudDMuZzE= step"><g class="shape" ><rect x="78" y="798" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="193" y="832.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">3.1 Arrays</text></g><g class="cGFydDIudDMuZzI= step"><g class="shape" ><rect x="324" y="798" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="439" y="832.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">3.2 Text</text></g><g class="cGFydDIudDMuZzM= step"><g class="shape" ><rect x="570" y="798" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="685" y="832.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">3.3 Files and lists</text></g><g class="cGFydDMudDQuZzE= step"><g class="shape" ><rect x="201" y="1076" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="316" y="1110.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">4.1 Methods</text></g><g class="cGFydDMudDQuZzI= step"><g class="shape" ><rect x="447" y="1076" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="562" y="1110.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">4.2 Errors</text></g><g class="KHBhcnQwIC0mZ3Q7IHBhcnQxKVswXQ=="><marker id="mk-d2-785071817-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 439 221.5 L 439 286.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-785071817-3488