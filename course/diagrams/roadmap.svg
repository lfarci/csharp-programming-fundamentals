/g><g class="cGFydDEudDI= part"><g class="shape" ><rect x="62" y="340" width="754" height="252" rx="14" stroke="#c7cdea" fill="#f7f8fc" style="stroke-width:1;" /></g><text x="439" y="365" fill="#3451b2" class="text-bold" style="text-anchor:middle;font-size:20px">2. Loops</text></g><g class="cGFydDIudDM= part"><g class="shape" ><rect x="62" y="762" width="754" height="108" rx="14" stroke="#c7cdea" fill="#f7f8fc" style="stroke-width:1;" /></g><text x="439" y="787" fill="#3451b2" class="text-bold" style="text-anchor:middle;font-size:20px">3. Arrays, text and lists</text></g><g class="cGFydDMudDQ= part"><g class="shape" ><rect x="185" y="1040" width="508" height="108" rx="14" stroke="#c7cdea" fill="#f7f8fc" style="stroke-width:1;" /></g><text x="439" y="1065" fill="#3451b2" class="text-bold" style="text-anchor:middle;font-size:20px">4. Methods and errors</text></g><g class="cGFydDAudDEuZzE= step"><g class="shape" ><rect x="201" y="98" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="316" y="132.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">1.1 First programs</text></g><g class="cGFydDAudDEuZzI= step"><g class="shape" ><rect x="447" y="98" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="562" y="132.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">1.2 Conditions</text></g><g class="cGFydDEudDIuZzE= step"><g class="shape" ><rect x="78" y="376" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="193" y="410.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-size:18px">2.1 Count</text></g><g class="cGFydDEudDIuZzI= step"><g class="shape" ><rect x="324" y="376" width="230" height="56" rx="10" stroke="#3451b2" fill="#ffffff" style="stroke-width:2;" /></g><text x="439" y="410.5" fill="#1f2937" class="text-bold" style="text-anchor:middle;font-siz