<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Text · move a cursor through character cells</title><desc id="desc">Three snapshots of a cursor visiting c, a, t in cat!, with visited, current and unvisited cells.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#387ba2"/></marker></defs><rect width="960" height="620" rx="18" fill="#ffffff"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="29" fill="#18334b" text-anchor="start">Text · move a cursor through character cells</text><text x="36" y="84" font-family="Arial, sans-serif" font-size="19" fill="#18334b" text-anchor="start">A position tells you WHERE. A character tells you WHAT.</text><text x="36" y="175" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 1</text><text x="240" y="121" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 0</text><rect x="200" y="133" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="240" y="172.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">c</text><text x="340" y="121" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 1</text><rect x="300" y="133" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="340" y="172.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">a</text><text x="440" y="121" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 2</text><rect x="400" y="133" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="440" y="172.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">t</text><text x="540" y="121" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 3</text><rect x="500" y="133" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="540" y="172.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">!</text><path d="M240 229 L240 199" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><text x="670" y="171" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">current = 'c'</text><text x="36" y="295" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 2</text><text x="240" y="241" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 0</text><rect x="200" y="253" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#bdcddd" stroke-width="2"/><text x="240" y="292.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">c</text><text x="340" y="241" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 1</text><rect x="300" y="253" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="340" y="292.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">a</text><text x="440" y="241" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 2</text><rect x="400" y="253" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="440" y="292.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">t</text><text x="540" y="241" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 3</text><rect x="500" y="253" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="540" y="292.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">!</text><path d="M340 349 L340 319" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><text x="670" y="291" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">current = 'a'</text><text x="36" y="415" font-family="Arial, sans-serif" font-size="15" fill="#18334b" text-anchor="start">STEP 3</text><text x="240" y="361" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 0</text><rect x="200" y="373" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#bdcddd" stroke-width="2"/><text x="240" y="412.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">c</text><text x="340" y="361" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 1</text><rect x="300" y="373" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#bdcddd" stroke-width="2"/><text x="340" y="412.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">a</text><text x="440" y="361" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 2</text><rect x="400" y="373" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="440" y="412.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">t</text><text x="540" y="361" font-family="Arial, sans-serif" font-size="15" fill="#52677b" text-anchor="middle">index 3</text><rect x="500" y="373" width="80" height="60" rx="12" fill="#edf1f5" stroke="#bdcddd" stroke-width="2"/><text x="540" y="412.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">!</text><path d="M440 469 L440 439" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><text x="670" y="411" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">current = 't'</text><text x="36" y="510" font-family="Arial, sans-serif" font-size="21" fill="#18334b" text-anchor="start">Next: visit '!' at index 3. Then stop at index 4 (length = 4).</text><rect x="36" y="540" width="420" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="246" y="577" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="middle">COUNT 'a':   0 → 0 → 1 → 1 → 1</text><rect x="480" y="540" width="444" height="60" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="702" y="576.3" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="middle">BUILD:   "" → "c" → "ca" → "cat" → "cat!"</text></svg>