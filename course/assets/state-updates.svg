<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">State · preserve, then shift</title><desc id="desc">Four snapshots show Fibonacci state moving from 2,3 to 3,5 using a temporary next value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#387ba2"/></marker></defs><rect width="960" height="620" rx="18" fill="#ffffff"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="29" fill="#18334b" text-anchor="start">State · preserve, then shift</text><text x="36" y="85" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">Save the next value before overwriting either old value.</text><text x="270" y="135" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="middle">previous</text><text x="500" y="135" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="middle">current</text><text x="745" y="135" font-family="Arial, sans-serif" font-size="18" fill="#52677b" text-anchor="middle">next</text><text x="30" y="198" font-family="Arial, sans-serif" font-size="17" fill="#18334b" text-anchor="start">1. Old state</text><rect x="230" y="160" width="80" height="60" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="270" y="199.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">2</text><rect x="460" y="160" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="500" y="199.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="705" y="160" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="745" y="199.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">—</text><text x="30" y="298" font-family="Arial, sans-serif" font-size="17" fill="#18334b" text-anchor="start">2. Add old values</text><rect x="230" y="260" width="80" height="60" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="270" y="299.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">2</text><rect x="460" y="260" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="500" y="299.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="705" y="260" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="745" y="299.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">5</text><text x="815" y="297" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">2 + 3</text><text x="30" y="398" font-family="Arial, sans-serif" font-size="17" fill="#18334b" text-anchor="start">3. previous ← current</text><rect x="230" y="360" width="80" height="60" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="270" y="399.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="460" y="360" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="500" y="399.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="705" y="360" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="745" y="399.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">5</text><path d="M445 390 L325 390" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="498" font-family="Arial, sans-serif" font-size="17" fill="#18334b" text-anchor="start">4. current ← next</text><rect x="230" y="460" width="80" height="60" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="270" y="499.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="460" y="460" width="80" height="60" rx="12" fill="#e8f4ef" stroke="#68aa91" stroke-width="2"/><text x="500" y="499.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">5</text><rect x="705" y="460" width="80" height="60" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="745" y="499.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">5</text><path d="M690 490 L555 490" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="592" font-family="Arial, sans-serif" font-size="21" fill="#18334b" text-anchor="start">Read top to bottom: each row shows memory after one action.</text></svg>