<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Digits · peel from the right</title><desc id="desc">352 splits into remaining 35 and digit 2, then 3 and 5, then 0 and 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#387ba2"/></marker></defs><rect width="960" height="620" rx="18" fill="#ffffff"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="29" fill="#18334b" text-anchor="start">Digits · peel from the right</text><text x="36" y="85" font-family="Arial, sans-serif" font-size="20" fill="#18334b" text-anchor="start">Detach the last digit; keep working on what remains.</text><rect x="65" y="125" width="150" height="70" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="140" y="169.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">352</text><path d="M240 160 L350 160" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="125" width="150" height="70" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="460" y="169.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">35</text><rect x="650" y="125" width="100" height="70" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="700" y="169.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">2</text><text x="385" y="227" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">remaining = number / 10</text><text x="650" y="227" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">digit = number % 10</text><path d="M460 197 V241 H140 V260" fill="none" stroke="#387ba2" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="265" width="150" height="70" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="140" y="309.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">35</text><path d="M240 300 L350 300" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="265" width="150" height="70" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="460" y="309.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><rect x="650" y="265" width="100" height="70" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="700" y="309.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">5</text><text x="385" y="367" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">remaining = number / 10</text><text x="650" y="367" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">digit = number % 10</text><path d="M460 337 V381 H140 V400" fill="none" stroke="#387ba2" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="405" width="150" height="70" rx="12" fill="#e9f0f6" stroke="#bdcddd" stroke-width="2"/><text x="140" y="449.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><path d="M240 440 L350 440" fill="none" stroke="#387ba2" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="405" width="150" height="70" rx="12" fill="#e9f0fa" stroke="#95b0d3" stroke-width="2"/><text x="460" y="449.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">0</text><rect x="650" y="405" width="100" height="70" rx="12" fill="#fff0cc" stroke="#dbb754" stroke-width="2"/><text x="700" y="449.8" font-family="Arial, sans-serif" font-size="28" fill="#18334b" text-anchor="middle">3</text><text x="385" y="507" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">remaining = number / 10</text><text x="650" y="507" font-family="Arial, sans-serif" font-size="18" fill="#18334b" text-anchor="start">digit = number % 10</text><text x="65" y="590" font-family="Arial, sans-serif" font-size="22" fill="#18334b" text-anchor="start">Remaining is 0 → stop. Digits were visited in order: 2, 5, 3.</text></svg>