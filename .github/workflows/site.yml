name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website builds (no dead links, progress test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/package-lock.json
      - run: npm ci --prefix internal
      - name: Sync code format (same as ./ex progress)
        run: node internal/tools/check-site-sync.ts
      - name: Build the site (fails on dead links)
        run: npm run --prefix internal docs:build
      - name: Install the test browser
        run: npm exec --prefix internal -- playwright install --with-deps chromium
      - name: Progress ticks work in a real browser (Mark as done, reload, import)
        run: npm run --prefix internal test:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: internal/site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live:
    name: Live site (wait for this build, then browser tests)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://lfarci.github.io/csharp-programming-fundamentals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/package-lock.json
      - run: npm ci --prefix internal
      - name: Install the test browser
        run: npm exec --prefix internal -- playwright install --with-deps chromium
      - name: Wait until GitHub Pages serves this commit (version.txt and the build-sha meta tag)
        run: internal/tools/wait-for-deploy.sh "$SITE_URL" "$GITHUB_SHA" 300
      - name: Browser tests on the live site (2 retries, live only)
        run: npm run --prefix internal test:site
