name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  D2_VERSION: "v0.9.0"
  CSPELL: "cspell@10.4.0"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  solutions:
    name: Exercises (solutions pass the tests, starters compile, ./ex works)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
      - name: Run the exercise tests against the reference solutions and the starters
        run: internal/tools/check-exercises.sh
      - name: dotnet test works on the reference solutions (IDE Test Explorer path)
        run: dotnet test internal/tests/Practice.Tests -p:ExerciseProject=$PWD/internal/solutions/Solutions.csproj

  generator:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: No emoji in tracked files
        run: python3 internal/tools/check-no-emoji.py
      - name: Re-run the generator
        run: python3 internal/tools/generator/gen.py
      - name: Fail if generated files changed
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Course structure (short titles, groups, level order, balance, sidebar)
        run: python3 internal/tools/check-structure.py
      - name: Repo root has only the allowed entries (README, ./ex, practice/, course/, internal/, tool files)
        run: python3 internal/tools/check-root.py

  diagrams:
    name: Diagrams (D2 sources match the committed SVGs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install D2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          echo "/tmp/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Render every diagram and compare
        run: internal/tools/diagrams.sh --check

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: internal/.markdownlint-cli2.jsonc

  links:
    name: Links (internal and external)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Internal links and anchors (GitHub heading rules)
        run: python3 internal/tools/check-links.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: All links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config internal/lychee.toml --cache --max-cache-age 1d --root-dir ${{ github.workspace }} --no-progress './**/*.md'
          fail: true

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npx -y "$CSPELL" -c internal/cspell.json --no-progress "**/*.md"
